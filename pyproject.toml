[project]
name = "pysigma-backend-parseable"
version = "0.1.0"
description = "pySigma backend for Parseable SQL queries"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Parseable pySigma contributors" }]
keywords = ["sigma", "pysigma", "parseable", "security", "sql"]
dependencies = ["pysigma>=1.0.0,<2"]

[project.optional-dependencies]
test = [
  "coverage[toml]>=7.8",
  "pytest>=8.3",
  "pytest-cov>=6.1",
  "ruff>=0.12",
]

[project.urls]
Homepage = "https://github.com/parseablehq/pySigma-backend-parseable"
Issues = "https://github.com/parseablehq/pySigma-backend-parseable/issues"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sigma"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["integration: requires a live Parseable instance and fixture dataset"]

[tool.coverage.run]
branch = true
source = ["sigma.backends.parseable"]

[tool.ruff]
target-version = "py310"
line-length = 100
